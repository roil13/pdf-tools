name: Feature request
description: Suggest something the app should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Worth knowing before you write: this app is deliberately offline, has no
        AI features, and never modifies your originals. Suggestions that need a
        server or a model are out of scope rather than unwelcome.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task, not the solution — it often has a simpler answer.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
